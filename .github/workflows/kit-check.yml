name: kit-check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  kit-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run the kit's own gate
        shell: pwsh
        run: ./scripts/kit-check.ps1
